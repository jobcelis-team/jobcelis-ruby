# Builds and checks every pull request (Dependabot's too) the same way Release
# does before publishing, so a change that would break the release fails here.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 3.4 is where a missing gem dependency (base64) once broke require
    strategy:
      matrix:
        ruby: ["3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Build the gem
        run: gem build jobcelis.gemspec

      - name: Install and load it like a user would
        run: |
          gem install ./jobcelis-*.gem
          cd "$RUNNER_TEMP" && ruby -e 'require "jobcelis"; puts "loaded"'
