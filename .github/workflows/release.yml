# Publishes automatically when the version below changes on main:
#   1. reads the version from jobcelis.gemspec
#   2. if RubyGems does not have it yet, builds and pushes the gem
#   3. tags the commit (vX.Y.Z)
# Bump the version in jobcelis.gemspec to release; any other change publishes nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(ruby -e 'print Gem::Specification.load("jobcelis.gemspec").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Already released?
        id: check
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          MISSING=""
          [ -n "$RUBYGEMS_API_KEY" ] || MISSING="$MISSING RUBYGEMS_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::warning::Not publishing: add the repository secret(s)$MISSING, then run this workflow again (Actions > Release > Run workflow)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://rubygems.org/api/v2/rubygems/jobcelis/versions/${{ steps.v.outputs.version }}.json")
          if [ "$CODE" = "200" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published: nothing to do"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.check.outputs.release == 'true'
        with:
          ruby-version: "3.3"

      - name: Build gem
        if: steps.check.outputs.release == 'true'
        run: gem build jobcelis.gemspec

      - name: Publish to RubyGems
        if: steps.check.outputs.release == 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push jobcelis-${{ steps.v.outputs.version }}.gem

      - name: Tag the release
        if: steps.check.outputs.release == 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi
