# Publishes automatically on every push to main that changes the package:
#   1. next-version (jobcelis-team/.github) picks the version: the last release
#      plus a patch, or the version in jobcelis.gemspec and lib/jobcelis.rb when it was raised by hand.
#      Docs, tests, CI and repo config release nothing.
#   2. writes it into jobcelis.gemspec and lib/jobcelis.rb and commits it locally
#   3. builds the gem and publishes it to RubyGems
#   4. pushes the version commit and tags vX.Y.Z
# To release a minor or major version, raise it in jobcelis.gemspec and lib/jobcelis.rb.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: current
        run: |
          VERSION=$(ruby -e 'print Gem::Specification.load("jobcelis.gemspec").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Next version
        id: v
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: "v"

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i -E 's/(s\.version *= *)"[^"]+"/\1"'"$VERSION"'"/' jobcelis.gemspec
          sed -i -E 's/VERSION = "[^"]+"/VERSION = "'"$VERSION"'"/' lib/jobcelis.rb

      - name: Commit the version
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/commit-version@main
        with:
          version: ${{ steps.v.outputs.version }}

      - name: Already released?
        id: check
        if: steps.v.outputs.release == 'true'
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          MISSING=""
          [ -n "$RUBYGEMS_API_KEY" ] || MISSING="$MISSING RUBYGEMS_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::warning::Not publishing: add the repository secret(s)$MISSING, then run this workflow again (Actions > Release > Run workflow)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://rubygems.org/api/v2/rubygems/jobcelis/versions/${{ steps.v.outputs.version }}.json")
          if [ "$CODE" = "200" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published: nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.check.outputs.release == 'true'
        with:
          ruby-version: "3.3"

      - name: Build gem
        if: steps.check.outputs.release == 'true'
        run: gem build jobcelis.gemspec

      - name: Publish to RubyGems
        if: steps.check.outputs.release == 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push jobcelis-${{ steps.v.outputs.version }}.gem

      - name: Push the version and tag the release
        if: steps.v.outputs.release == 'true' && (steps.check.outputs.release == 'true' || steps.check.outputs.published == 'true')
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}
